# Copy to fly.toml (CI does this) or: fly launch --copy-config
#   fly apps create muhaqqiq-api
#   fly volumes create muhaqqiq_data --region iad --size 1
#   fly secrets set MUHAQQIQ_CORS_ORIGINS=https://YOUR.pages.dev
#   fly deploy

app = "muhaqqiq-api"
primary_region = "iad"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  MUHAQQIQ_DB = "/data/muhaqqiq.db"
  MUHAQQIQ_OCR = "stub"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "muhaqqiq_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
