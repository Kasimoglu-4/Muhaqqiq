<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }} · مُحقِّق</title>
  {% if og_title %}
  <meta property="og:title" content="{{ og_title }}" />
  <meta property="og:description" content="{{ og_description or '' }}" />
  <meta property="og:type" content="website" />
  {% if og_image %}<meta property="og:image" content="{{ og_image }}" />{% endif %}
  {% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #f1fcf5;
      --bg1: #eef5f0;
      --ink: #141e1a;
      --muted: #5f6f66;
      --accent: #b8923a;
      --accent-ink: #3f2d00;
      --ok: #2f7a5b;
      --ok-bg: #ebf7f0;
      --warn: #b8862d;
      --warn-bg: #fdf3e3;
      --danger: #9e3b3b;
      --danger-bg: #fde8e8;
      --undetermined: #6b7c72;
      --undetermined-bg: #f0f4f2;
      --line: #d1c5b2;
      --surface: #ffffff;
      --surface-low: #ebf6f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans Arabic", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(184, 146, 58, 0.12), transparent 55%),
        radial-gradient(900px 500px at 0% 100%, rgba(47, 122, 91, 0.1), transparent 50%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
    }
    main {
      width: min(720px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.5rem 0 4rem;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 700;
      margin: 0 0 0.35rem;
      letter-spacing: -0.02em;
    }
    .brand { color: var(--accent); }
    .lead { color: var(--muted); margin: 0 0 1.75rem; line-height: 1.7; }
    textarea {
      width: 100%;
      min-height: 160px;
      resize: vertical;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 12px;
      padding: 1rem 1.1rem;
      font: inherit;
      font-size: 1.1rem;
      line-height: 1.8;
    }
    textarea:focus {
      outline: 2px solid rgba(184, 146, 58, 0.45);
      outline-offset: 1px;
    }
    button, .btn {
      display: inline-block;
      margin-top: 1rem;
      border: 0;
      border-radius: 10px;
      padding: 0.85rem 1.4rem;
      background: var(--accent);
      color: var(--accent-ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    button:hover, .btn:hover { filter: brightness(0.96); }
    .card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.4rem 1.5rem;
      background: var(--surface);
      box-shadow: 0 1px 3px rgba(26, 36, 32, 0.04);
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }
    .badge.SUPPORTED { background: var(--ok-bg); color: var(--ok); }
    .badge.CLOSE_WITH_DIFF { background: var(--warn-bg); color: var(--warn); }
    .badge.ATTRIBUTED_RULING { background: #f5ebe4; color: #7a5340; }
    .badge.UNDETERMINED { background: var(--undetermined-bg); color: var(--undetermined); }
    .verse {
      font-family: "Amiri Quran", serif;
      font-size: 1.45rem;
      line-height: 2.1;
      margin: 1rem 0;
    }
    .meta { color: var(--muted); font-size: 0.95rem; line-height: 1.7; }
    .diff del { background: var(--danger-bg); text-decoration: none; }
    .diff ins { background: var(--ok-bg); text-decoration: none; }
    .hl-equal { color: var(--ink); }
    .hl-replace, .hl-insert { background: var(--warn-bg); border-radius: 3px; }
    .hl-insert_marker { color: var(--danger); font-weight: 700; }
    .foot {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.65;
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
