[project]
name = "muhaqqiq"
version = "1.0.0"
description = "Fast verification tool for viral Islamic text (Quran and hadith)"
readme = "README.md"
authors = [
    { name = "Omer Kasimoglu", email = "omer.kasimoglu4@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "rapidfuzz>=3.10.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "pillow>=10.0.0",
]

[project.scripts]
muhaqqiq = "muhaqqiq.main:run"
muhaqqiq-load = "pipeline.load_all:main"
muhaqqiq-validate = "pipeline.validate:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "pip-audit>=2.7.0",
]
postgres = [
    "psycopg[binary]>=3.2.0",
]
embeddings = [
    "numpy>=2.0.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "numpy>=2.0.0",
    "opencv-python-headless>=4.10.0",
    "winocr>=0.0.15; sys_platform == 'win32'",
]
ml = [
    "numpy>=2.0.0",
    "sentence-transformers>=3.0.0",
]
worker = [
    "playwright>=1.49.0",
]
ops = [
    "sentry-sdk[fastapi]>=2.0.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
