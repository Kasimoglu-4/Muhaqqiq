services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: muhaqqiq
      POSTGRES_PASSWORD: muhaqqiq
      POSTGRES_DB: muhaqqiq
    ports:
      # High host port avoids local Postgres on 5432/5433
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema/postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muhaqqiq -d muhaqqiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://muhaqqiq:muhaqqiq@postgres:5432/muhaqqiq
      MUHAQQIQ_DB: /data/muhaqqiq.db
    ports:
      - "8000:8000"
    volumes:
      - ./data/build:/data
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://muhaqqiq:muhaqqiq@postgres:5432/muhaqqiq
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

volumes:
  pgdata:
